name: Sync upstream

# 自动同步已暂停：原上游 602832789/qq-farm-bot 已被删除，定时任务只会每 6 小时失败一次。
# 需要恢复时，把上游地址换成有效仓库并重新加回 schedule。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/602832789/qq-farm-bot.git
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "fork main 已包含上游最新提交，无需同步。"
            exit 0
          fi

          git merge --no-edit upstream/main
          git push origin HEAD:main
          echo "已同步到 $(git rev-parse --short upstream/main)"
